name: Update README

# Puts every new blog post on the roadmap chart and its interactive page, moves the red line to today and refreshes the counts.
on:
  schedule:
    - cron: "5 */3 * * *"      # every three hours, and just after midnight in Madrid
  workflow_dispatch:
  push:
    branches: [main]
    paths: [roadmap.json, scripts/update_readme.py]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_readme.py
      - name: Commit if anything changed
        run: |
          git add README.md assets/roadmap.svg docs/index.html
          if git diff --cached --quiet; then echo "Everything already current"; exit 0; fi
          git config user.name "Iñigo"
          git config user.email "inigogonzalezgarcia@yahoo.es"
          git commit -m "Profile: roadmap update"
          git push
